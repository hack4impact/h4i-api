# The local sandbox for stage 2's sandbox suite (wiki: staged-rollout-stage-2, package 9). Throwaway, localhost only.
# scripts/sandbox-setup.sh starts it and seeds it once per machine; scripts/sandbox-e2e.sh and sandbox-check.sh use it.
# Slack, Google and GitHub aren't here: the suite uses the shared sandbox accounts, with credentials from the vault.
# Secrets (Documenso's keys, the certificate passphrase) are generated by sandbox-setup.sh into .env next to this file.
name: h4i-sandbox
services:
  # The portal's database for the suite, emptied by every run.
  portal-db:
    image: postgres:17
    environment: { POSTGRES_DB: portal, POSTGRES_USER: portal, POSTGRES_PASSWORD: portal }
    ports: ["127.0.0.1:5437:5432"]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "portal"], interval: 2s, retries: 30 }

  # Vaultwarden over HTTPS with a local CA (certs/ca.pem is the portal's PORTAL_ADAPTERS_VAULTWARDEN_TRUSTEDCERTIFICATE).
  # No mail: an invite to a registered user is accepted at once, so the suite can confirm members without anyone
  # clicking a link.
  vaultwarden:
    image: vaultwarden/server:1.37.4
    environment:
      DOMAIN: https://localhost:8443
      ROCKET_PORT: "8443"
      ROCKET_TLS: '{certs="/ssl/vaultwarden.pem",key="/ssl/vaultwarden-key.pem"}'
      SIGNUPS_ALLOWED: "true"
    volumes: ["./certs:/ssl:ro", "vaultwarden:/data"]
    ports: ["127.0.0.1:8443:8443"]

  # Catches Documenso's emails (signing requests, sign-up verification): http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31
    ports: ["127.0.0.1:8025:8025"]

  documenso-db:
    image: postgres:15
    environment: { POSTGRES_DB: documenso, POSTGRES_USER: documenso, POSTGRES_PASSWORD: documenso }
    volumes: ["documenso-db:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "documenso"], interval: 2s, retries: 30 }

  # Documenso, the version staging runs: http://localhost:3010
  documenso:
    image: documenso/documenso:v2.20.0
    depends_on: { documenso-db: { condition: service_healthy } }
    environment:
      PORT: "3000"
      NEXTAUTH_SECRET: ${DOCUMENSO_NEXTAUTH_SECRET:?run scripts/sandbox-setup.sh}
      NEXT_PRIVATE_ENCRYPTION_KEY: ${DOCUMENSO_ENCRYPTION_KEY:?run scripts/sandbox-setup.sh}
      NEXT_PRIVATE_ENCRYPTION_SECONDARY_KEY: ${DOCUMENSO_ENCRYPTION_SECONDARY_KEY:?run scripts/sandbox-setup.sh}
      NEXT_PUBLIC_WEBAPP_URL: http://localhost:3010
      NEXT_PRIVATE_INTERNAL_WEBAPP_URL: http://localhost:3000
      NEXT_PRIVATE_DATABASE_URL: postgres://documenso:documenso@documenso-db:5432/documenso
      NEXT_PRIVATE_DIRECT_DATABASE_URL: postgres://documenso:documenso@documenso-db:5432/documenso
      NEXT_PRIVATE_SMTP_TRANSPORT: smtp-auth
      NEXT_PRIVATE_SMTP_HOST: mailpit
      NEXT_PRIVATE_SMTP_PORT: "1025"
      NEXT_PRIVATE_SMTP_FROM_NAME: H4I Sign (sandbox)
      NEXT_PRIVATE_SMTP_FROM_ADDRESS: sign@example.test
      NEXT_PRIVATE_SIGNING_LOCAL_FILE_PATH: /opt/documenso/cert.p12
      NEXT_PRIVATE_SIGNING_PASSPHRASE: ${DOCUMENSO_SIGNING_PASSPHRASE:?run scripts/sandbox-setup.sh}
    volumes: ["./certs/documenso.p12:/opt/documenso/cert.p12:ro"]
    ports: ["127.0.0.1:3010:3000"]

volumes:
  vaultwarden:
  documenso-db:
