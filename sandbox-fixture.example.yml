# The sandbox check's and suite's fixture (stage 2 package 9). scripts/sandbox-setup.sh writes one for the local
# sandbox (deploy/sandbox/sandbox-fixture.yml); copy this to add the shared sandboxes' people. Your copy is git-ignored.
# Accounts match a tool login, email or ID; resources match a name or external ID in the tool.
chapter: { code: sandbox, name: H4I Portal Sandbox }

people:
  - name: Lena Lead
    role: lead                      # chapter role (optional)
    email: lena@example.test        # their H4I address: tools invite it when they have no account yet (optional)
    accounts: { github: lena-gh, slack: lena, google: lena@hack4impact.org }
  - name: Alan Alumnus
    status: alumni                  # default active; the suite puts every active person on its project
    accounts: { slack: alan }

# The rest is for scripts/sandbox-check.sh only (the suite makes its own project and resources).
resources:
  - { key: repo-team, tool: github, match: Team 1 }
  - { key: general, tool: slack, match: general }

projects:
  - name: Sandbox Project
    members:
      - { person: Lena Lead, role: lead }           # role: member (default) or lead
      - { person: Alan Alumnus, signed: false }     # signed defaults to true
    resources:
      - { resource: repo-team, audience: team, access: write, requiresAgreement: true }

chapterResources:
  - { resource: general, audience: members, access: write }

# Exactly what the dry run should plan: kind add | change | remove | drift | unmatched_account | missing_resource.
# person is omitted for unmatched_account and missing_resource.
expect:
  - { kind: add, person: Lena Lead, resource: repo-team }
  - { kind: drift, person: Alan Alumnus, resource: general }
